[project]
name = "synapse"
version = "0.1.0"
description = "Hackathon multi-agent coordination demo"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "mcp>=1.9,<2",
    "httpx>=0.28,<1",
    # ANS identity mode: DNS discovery and DPoP/certificate verification.
    "dnspython>=2.7,<3",
    "cryptography>=44,<51",
    # Databricks tracing sink.
    "databricks-sdk>=0.80,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["."]
